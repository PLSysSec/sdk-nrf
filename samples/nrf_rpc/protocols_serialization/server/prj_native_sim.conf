CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_ZCBOR_BACKUPS=1
CONFIG_NRF_RPC_THREAD_STACK_SIZE=4096
CONFIG_NRF_RPC_GROUP_INIT_WAIT_TIME=-1

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NRF_RPC_UART_TRANSPORT=y
# CONFIG_NRF_RPC_IPC_SERVICE is not set
CONFIG_NRF_RPC_CBKPROXY_OUT_SLOTS=0

CONFIG_NRF_RPC_UTILS=y
CONFIG_NRF_RPC_UTILS_SERVER=y

# Enable Bluetooth stack (required for BT_RPC)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Enable Bluetooth RPC to match real hardware
CONFIG_BT_RPC=y
CONFIG_BT_RPC_HOST=y
CONFIG_BT_RPC_INITIALIZE_NRF_RPC=n

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
# CONFIG_SHELL_BACKEND_SERIAL is not set
# Use dummy backend to keep shell thread alive
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_PRINTK=y
# Enable logging from ISR context (where UART RX happens)
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y

# Native sim doesn't need flash/settings for this demo
# CONFIG_SETTINGS is not set
# CONFIG_FLASH is not set
# CONFIG_FLASH_MAP is not set

CONFIG_LOG_BUFFER_SIZE=21000
CONFIG_LOG_MAX_LEVEL=4
CONFIG_NRF_RPC_LOG_LEVEL_DBG=y
CONFIG_NRF_RPC_TR_LOG_LEVEL_DBG=y
CONFIG_NRF_RPC_OS_LOG_LEVEL_DBG=y
CONFIG_NRF_RPC_CBOR_LOG_LEVEL_DBG=y

# Keep simulation alive with periodic tick
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_NRF_RPC_UTILS_CLIENT=y
CONFIG_NRF_RPC_UTILS_DEV_INFO=y
CONFIG_NRF_RPC_UTILS_REMOTE_SHELL=y
CONFIG_NRF_RPC_UTILS_SYSTEM_HEALTH=y