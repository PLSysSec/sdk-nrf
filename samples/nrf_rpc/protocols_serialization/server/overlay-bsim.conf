# Keep RPC
CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_NRF_RPC_UART_TRANSPORT=y
CONFIG_NRF_RPC_UART_RELIABLE=n

# Native simulation UART stack (new driver name)
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_PTY=y

# IMPORTANT: stop deprecated shim
CONFIG_UART_NATIVE_POSIX=n

# Avoid unsupported features on PTY UART
CONFIG_UART_LINE_CTRL=n
CONFIG_UART_INTERRUPT_DRIVEN=y

