CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1

# Enable security with automatic Just Works pairing
CONFIG_BT_SMP=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_BT_SETTINGS=y

# Set IO capabilities for Numeric Comparison (provides L3 with MITM)
CONFIG_BT_SMP_SC_PAIR_ONLY=y

CONFIG_DK_LIBRARY=y
CONFIG_SFLOAT=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
